name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC x64
            os: windows-latest
            cc: cl
            cxx: cl
          - name: Apple Clang
            os: macos-14
            cc: clang
            cxx: clang++
          - name: GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset ci --fresh -G Ninja
      - name: Build
        run: cmake --build --preset ci --parallel
      - name: Test
        run: ctest --preset ci --output-on-failure

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ci-sanitizers --fresh -G Ninja
      - name: Build
        run: cmake --build --preset ci-sanitizers --parallel
      - name: Test
        run: ctest --preset ci-sanitizers --output-on-failure

  lua-bridge:
    name: Lua 5.4 bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Test portable mGBA adapter
        run: >-
          lua5.4 tests/lua/BridgeScriptTests.lua
          RogueAssistantCpp/Assets/RogueAssistant_mGBA.lua
          tests/fixtures/bridge_protocol_1.golden

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Show analyzer version
        run: clang-tidy --version
      - name: Configure
        run: cmake --preset ci-clang-tidy --fresh -G Ninja
      - name: Analyze and build
        run: cmake --build --preset ci-clang-tidy --parallel
      - name: Test
        run: ctest --preset ci-clang-tidy --output-on-failure
